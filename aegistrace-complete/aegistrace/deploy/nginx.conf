# Template rendered by frontend/entrypoint.sh at container start.
# Only ${LLM_RATE_LIMIT_PER_MINUTE} and ${MAX_REQUEST_BODY_BYTES} are substituted.
pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $request_method $chat_limit_key {
    default $binary_remote_addr;
    OPTIONS "";
  }
  limit_req_zone $chat_limit_key zone=chat:10m rate=${LLM_RATE_LIMIT_PER_MINUTE}r/m;
  # Generated from ALLOWED_ORIGINS so gateway-generated JSON errors keep CORS.
  include /tmp/corsmap.conf;
  server {
    # Agent-origin requests are rejected below before any proxy location is used.
    # Listen on both interfaces so Docker host port forwarding remains portable.
    listen 3000;
    server_name _;
    # Real-IP resolution stays off unless TRUSTED_PROXY_CIDR names a proxy.
    include /tmp/realip.conf;
    client_max_body_size ${MAX_REQUEST_BODY_BYTES};
    # Defense in depth if routes/IP configuration is changed; ignore spoofed XFF.
    deny 172.29.11.3;
    deny 172.29.12.3;
    deny 172.29.15.3;
    deny 172.29.16.3;
    allow all;
    limit_req_status 429;
    error_page 413 = @payload_too_large;
    error_page 429 = @rate_limited;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control no-store always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 32s;
    proxy_connect_timeout 3s;
    location = /chat {
      limit_except POST OPTIONS { deny all; }
      limit_req zone=chat burst=5 nodelay;
      proxy_pass http://agent_service:8000/chat;
    }
    location = /demo/session {
      limit_except POST OPTIONS { deny all; }
      limit_req zone=chat burst=5 nodelay;
      proxy_pass http://agent_service:8000/demo/session;
    }
    location @payload_too_large {
      default_type application/json;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy same-origin always;
      add_header Cache-Control no-store always;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Vary Origin always;
      return 413 '{"error":"payload_too_large","message":"The request body is too large. Shorten the message and try again."}';
    }
    location @rate_limited {
      default_type application/json;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy same-origin always;
      add_header Cache-Control no-store always;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Vary Origin always;
      return 429 '{"error":"rate_limited","message":"Too many requests. Wait a moment and try again."}';
    }
    location / { proxy_pass http://reconstruction_service:8002; }
  }
}
