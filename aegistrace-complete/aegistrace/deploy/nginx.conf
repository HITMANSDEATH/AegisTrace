pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $request_method $chat_limit_key {
    default $binary_remote_addr;
    OPTIONS "";
  }
  limit_req_zone $chat_limit_key zone=chat:10m rate=30r/m;
  server {
    # Agent-origin requests are rejected below before any proxy location is used.
    # Listen on both interfaces so Docker host port forwarding remains portable.
    listen 3000;
    server_name _;
    client_max_body_size 160k;
    # Defense in depth if routes/IP configuration is changed; ignore spoofed XFF.
    deny 172.29.11.3;
    deny 172.29.12.3;
    deny 172.29.15.3;
    deny 172.29.16.3;
    allow all;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control no-store always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 32s;
    proxy_connect_timeout 3s;
    location = /chat {
      limit_except POST OPTIONS { deny all; }
      limit_req zone=chat burst=5 nodelay;
      proxy_pass http://agent_service:8000/chat;
    }
    location = /demo/session {
      limit_except POST OPTIONS { deny all; }
      limit_req zone=chat burst=5 nodelay;
      proxy_pass http://agent_service:8000/demo/session;
    }
    location / { proxy_pass http://reconstruction_service:8002; }
  }
}
